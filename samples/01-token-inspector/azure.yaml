# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: token-inspector
metadata:
  template: entra-id-end-to-end/01-token-inspector@1.0.0

services:
  web:
    project: .
    language: js
    host: appservice

# The hook runs Node rather than a .ps1 or a .sh, on purpose.
#
# A .ps1 hook is blocked on most Windows machines by the PowerShell execution
# policy because the file is not signed. A .sh hook on Windows often resolves
# to WSL bash, which cannot see the repository path azd hands it. Running
# "node <file>" is a command rather than a script file, so no execution policy
# applies, and Node is already a prerequisite for this sample.
hooks:
  preprovision:
    posix:
      shell: sh
      run: node ./scripts/preprovision.mjs
      interactive: false
      continueOnError: false
    windows:
      shell: pwsh
      run: node ./scripts/preprovision.mjs
      interactive: false
      continueOnError: false
